{#- Reset, as in the reviewer's Explore tab, behind a confirmation: it closes the round for good. -#}
{% if reset %}
<details class="reset">
  <summary>Reset</summary>
  <form class="reset" method="post" action="/reset">
    <input type="hidden" name="round" value="{{ reset }}">
    <p class="hint">Reset closes this round for good: it is no longer shown, its agent can no longer post to it, and the page offers to start a new round. Its records stay saved.</p>
    <button class="danger" type="submit">Confirm reset</button>
  </form>
</details>
{% endif %}
