[package]
name = "reviewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
jev-evals = ["dep:serde"]

[dependencies]
vision-turns = { path = "../vision-turns" }
agent-fork = { path = "../agent-fork" }
agent-forks = { path = "../agent-forks" }
agent-hooks = { path = "../agent-hooks" }
claude-fork = { path = "../claude-fork" }
claude-hooks = { path = "../claude-hooks" }
codex-fork = { path = "../codex-fork" }
codex-hooks = { path = "../codex-hooks" }
review-explore = { path = "../review-explore" }
review-explore-page = { path = "../review-explore-page" }
review-explore-page-host = { path = "../review-explore-page-host" }
review-explore-page-opening = { path = "../review-explore-page-opening" }
review-explore-page-settings = { path = "../review-explore-page-settings" }
review-explore-session = { path = "../review-explore-session" }
review-explore-stats = { path = "../review-explore-stats" }
review-run-ahead = { path = "../review-run-ahead" }
review-significance = { path = "../review-significance" }
toasts = { path = "../toasts" }
text-search = { path = "../text-search" }
crossterm = { workspace = true, features = ["osc52"] }
crossbeam-channel.workspace = true
component-core = { path = "../component-core" }
eyre.workspace = true
fs2.workspace = true
herdr-client = { path = "../herdr-client" }
ignore.workspace = true
notify.workspace = true
ratatui = { workspace = true, features = ["crossterm"] }
review-repository = { path = "../review-repository" }
review-source = { path = "../review-source" }
review-lsp = { path = "../review-lsp" }
review-hunks = { path = "../review-hunks" }
review-state = { path = "../review-state" }
review-threads = { path = "../review-threads" }
review-thread-service = { path = "../review-thread-service" }
review-mcp = { path = "../review-mcp" }
review-mcp-config = { path = "../review-mcp-config" }
review-state-migration = { path = "../review-state-migration" }
review-store = { path = "../review-store" }
review-types = { path = "../review-types" }
review-ui = { path = "../review-ui" }
ui-events = { path = "../ui-events" }
vision-signal = { path = "../vision-signal" }
serde_json.workspace = true
reqwest.workspace = true
sha2.workspace = true
signal-hook.workspace = true
syntax-highlighting = { path = "../syntax-highlighting" }
serde = { workspace = true, optional = true }
tiktoken-rs = "0.12"

[dev-dependencies]
codex-daemon = { path = "../codex-daemon" }
# The tests learn that the thread worker sent every prompt it was asked to.
review-thread-service = { path = "../review-thread-service", features = ["flush"] }
review-explore-round-settings = { path = "../review-explore-round-settings" }
review-round-conversation = { path = "../review-round-conversation" }
uuid.workspace = true
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
tokio.workspace = true
review-test-support = { path = "../review-test-support" }
# The tests run its program in the agent's pane, which `make test` builds.
stand-in-agent = { path = "../stand-in-agent" }
test-case.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[[bin]]
name = "reviewer"
path = "src/main.rs"

[[bin]]
name = "reviewer-control"
path = "src/bin/reviewer-control.rs"
