[workspace]
members = [
    "crates/component-core",
    "crates/components/diff",
    "crates/components/files",
    "crates/components/guide",
    "crates/components/locations",
    "crates/components/status",
    "crates/components/overlay",
    "crates/components/revision",
    "crates/guide-rendering",
    "crates/syntax-highlighting",
    "crates/ui-actions",
    "crates/ui-events",
    "crates/ui-shortcuts",
    "crates/ui-theme",
    "crates/herdr-client",
    "crates/review-guide",
    "crates/review-guide-runner",
    "crates/review-lsp",
    "crates/review-repository",
    "crates/review-state",
    "crates/review-store",
    "crates/review-test-support",
    "crates/review-types",
    "crates/review-ui",
    "crates/reviewer",
    "crates/toasts",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
base64 = "0.22"
crossterm = "0.28"
crossbeam-channel = "0.5"
eyre = "0.6"
fs2 = "0.4"
getrandom = "0.3"
gix-imara-diff = "0.2"
ignore = "0.4.23"
libc = "0.2"
lsp-server = "0.10"
lsp-types = "0.97"
notify = "8.2"
ratatui = { version = "0.29", default-features = false }
ratatui-markdown = { version = "=0.3.6", default-features = false, features = ["markdown"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
signal-hook = "0.3"
strum = { version = "0.26", features = ["derive"] }
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy", "dump-load"] }
tempfile = "3.20"
test-case = "3.3.1"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting"] }
toml = "0.9"
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"
url = "2.5"
uuid = { version = "1.24", features = ["v4"] }
zstd = "0.13"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
panic = "unwind"
